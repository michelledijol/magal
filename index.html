<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>MAGAL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="_ds_bundle.js"></script>
<script src="magal-i18n.js"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#fff}
@keyframes magalPulse{0%,100%{opacity:0.35}50%{opacity:1}}
a{color:#7f2d2d}
a:hover{color:#5c1f1f}
</style>
</helmet>
<div style="position:fixed;inset:0;font-family:'Nunito Sans',sans-serif">
  <iframe ref="{{ frameRef }}" src="{{ src }}" title="MAGAL landing" style="width:100%;height:100%;border:0;display:block;background:#fff"></iframe>
  <div ref="{{ loaderRef }}" style="position:fixed;inset:0;z-index:5;background:#fff;display:flex;align-items:center;justify-content:center;opacity:1;pointer-events:none;transition:opacity 0.4s ease">{{ loaderMark }}</div>
  <div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px">
    <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;background:#fff;border:1px solid #231f20;box-shadow:0 12px 40px rgba(0,0,0,0.25);min-width:240px">
        <sc-for list="{{ options }}" as="o" hint-placeholder-count="4">
          <button type="button" onClick="{{ o.pick }}" style="display:flex;justify-content:space-between;align-items:center;gap:24px;padding:14px 18px;background:{{ o.bg }};color:{{ o.fg }};border:0;border-bottom:1px solid #e2e2e2;font:inherit;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;text-align:left" style-hover="background:#f1f1f1;color:#231f20"><span>{{ o.label }}</span><span style="font-size:11px;letter-spacing:0.1em;text-transform:none;opacity:0.7">{{ o.note }}</span></button>
        </sc-for>
      </div>
    </sc-if>
    <button type="button" onClick="{{ toggle }}" style="display:flex;align-items:center;gap:14px;height:48px;padding:0 22px;background:#231f20;color:#fff;border:1px solid #fff;font:inherit;font-size:11px;letter-spacing:0.26em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,0.3);white-space:nowrap" style-hover="background:#7f2d2d"><span style="white-space:nowrap">Opción · {{ current }}</span><span style="font-size:14px;letter-spacing:0">{{ caret }}</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  opts = [
    { label: 'v4', note: 'Landing v4', file: 'v4.html' },
    { label: 'v5', note: 'Landing v5', file: 'v5.html' },
    { label: 'Noir', note: 'Opción 1b', file: 'noir.html' },
    { label: 'Atelier', note: 'Opción 1c', file: 'atelier.html' },
    { label: 'Mix', note: 'Atelier + v5', file: 'mix.html' }
  ];
  frameRef = React.createRef(); loaderRef = React.createRef();
  watch() {
    clearInterval(this.iv); clearTimeout(this.t);
    const L = this.loaderRef.current, F = this.frameRef.current; if (!L) return;
    L.style.opacity = '1';
    const want = this.opts[this.state.sel].file;
    const hide = () => { clearInterval(this.iv); clearTimeout(this.t); L.style.opacity = '0'; };
    this.iv = setInterval(() => {
      try { const d = F.contentDocument; if (d && d.readyState !== 'loading' && d.body && d.body.querySelector('[data-screen-label]') && decodeURI(F.contentWindow.location.pathname).endsWith(want)) hide(); } catch (e) { hide(); }
    }, 200);
    this.t = setTimeout(hide, 2500);
  }
  componentDidMount() { this.watch(); }
  componentDidUpdate(p, s) { if (s.sel !== this.state.sel) this.watch(); }
  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.t); }
  state = { sel: Math.min(4, +(localStorage.getItem('magal-option') || 1)), open: false };
  renderVals() {
    const { sel, open } = this.state;
    return {
      src: encodeURI(this.opts[sel].file),
      current: this.opts[sel].label,
      frameRef: this.frameRef, loaderRef: this.loaderRef,
      loaderMark: this.mark || (this.mark = React.createElement('span', { style: { fontFamily: "'Nunito Sans',sans-serif", fontWeight: 200, fontSize: 'clamp(32px,5vw,64px)', letterSpacing: '0.5em', paddingLeft: '0.5em', color: '#231f20', animation: 'magalPulse 1.6s ease-in-out infinite' } }, 'MAGAL')),
      open, caret: open ? '×' : '▴',
      toggle: () => this.setState({ open: !open }),
      options: this.opts.map((o, i) => ({
        ...o, bg: i === sel ? '#231f20' : '#fff', fg: i === sel ? '#fff' : '#231f20',
        pick: () => { localStorage.setItem('magal-option', i); this.setState({ sel: i, open: false }); }
      }))
    };
  }
}
</script>
</body>
</html>
