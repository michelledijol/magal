<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,200;6..12,300;6..12,400;6..12,600&display=swap">
<link rel="stylesheet" href="_ds/classical-6e2d3d8b-98e2-4f80-b0b4-7a799aefe802/styles.css">
<script src="_ds/classical-6e2d3d8b-98e2-4f80-b0b4-7a799aefe802/_ds_bundle.js"></script>
</helmet>
<section data-screen-label="Six ways" style="background:{{ bg }};color:{{ fg }};font-family:'Nunito Sans','Avenir LT Pro',Avenir,sans-serif;border-top:1px solid {{ line }};border-bottom:1px solid {{ line }}">
  <div style="max-width:1360px;margin:0 auto;padding:clamp(80px,12vh,140px) clamp(20px,4vw,56px);display:flex;flex-direction:column;gap:clamp(40px,6vh,72px)">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px 56px;align-items:end">
      <div style="display:flex;flex-direction:column;gap:16px">
        <span style="font-size:11px;letter-spacing:0.32em;text-transform:uppercase;color:{{ accent }}">Fecit Potentiam · 42 mm</span>
        <h2 style="margin:0;font-weight:200;font-size:clamp(44px,5.6vw,88px);line-height:0.95">One dial.<br>Six ways.</h2>
      </div>
      <p style="margin:0;font-size:15px;line-height:27px;max-width:42ch;color:{{ muted }}">The same deep red dial, dressed in crocodile or Louisiana lizard — black, bordeaux or navy. Pick yours, or own the set: the strap changes in seconds.</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));border-top:1px solid {{ fg }}">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
        <a href="{{ it.wa }}" target="_blank" style="display:flex;flex-direction:column;gap:14px;padding:28px 12px 22px;border-right:1px solid {{ line }};border-bottom:1px solid {{ line }};color:{{ fg }};text-decoration:none;transition:background 0.3s" style-hover="background:{{ hover }};color:{{ fg }}">
          <span style="font-size:11px;letter-spacing:0.2em;color:{{ muted }};font-variant-numeric:tabular-nums">{{ it.n }}</span>
          <div style="width:100%;max-width:184px;margin:0 auto;aspect-ratio:184/308;background-image:url({{ it.src }});background-size:300% 100%;background-position:{{ it.pos }};background-repeat:no-repeat"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <span style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;line-height:16px">{{ it.leather }}<br><span style="color:{{ muted }}">{{ it.colour }}</span></span>
            <span style="width:12px;height:12px;border-radius:50%;flex:none;background:{{ it.sw }};box-shadow:0 0 0 1px {{ line }}"></span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:760},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;},&quot;whatsapp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const n = String(this.props.whatsapp ?? '').replace(/\D/g, '');
    const cols = [['Black', '#1c1b1d'], ['Bordeaux', '#5c1f26'], ['Navy', '#1d2b52']];
    const items = [];
    [['Crocodile', 'catalog/img284.png'], ['Lizard', 'catalog/img285.png']].forEach(([leather, src]) =>
      cols.forEach(([colour, sw], i) => items.push({
        leather, colour, sw, src, pos: ['0% 0', '50% 0', '100% 0'][i],
        n: String(items.length + 1).padStart(2, '0'),
        wa: 'https://wa.me/' + n + '?text=' + encodeURIComponent(`Hello MAGAL, I'm interested in Fecit Potentiam on ${colour.toLowerCase()} ${leather.toLowerCase()}.`)
      })));
    return {
      items,
      bg: dark ? '#231f20' : '#fff', fg: dark ? '#fff' : '#231f20',
      muted: dark ? '#b5b0b1' : '#6b6b6b', line: dark ? '#3b3536' : '#e2e2e2',
      hover: dark ? '#2e292a' : '#f6f6f6', accent: dark ? '#c46a6a' : '#7f2d2d'
    };
  }
}
</script>
</body>
</html>
